version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sushigo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sushigo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sushigo_pass}
      POSTGRES_DB: ${DB_NAME:-sushigo_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: